<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1f3a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>الطارق لتجارة الأقمشة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1f3a;--navy2:#1a2e52;--gold:#b8913f;--gold2:#e2c47c;--bg:#f4f1ea;--card:#fff;--ink:#1d2433;--muted:#6b7280;--line:#e6e0d3;--red:#b42318;--redbg:#fdecea;--green:#067647;--greenbg:#e7f6ee;--amber:#9a6700;--amberbg:#fff6dd}
*{box-sizing:border-box}
[hidden]{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.topbar .gs{flex:1;max-width:580px;position:relative}
.topbar .gs input{border-radius:30px;padding:10px 18px;background:#fff;box-shadow:0 2px 10px rgba(15,31,58,.06)}
.tb-r{display:flex;gap:12px;align-items:center;font-size:13.5px;flex-wrap:wrap}
.kbd{background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:12px;color:var(--muted)}
.combo{position:absolute;top:100%;right:0;left:0;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(15,31,58,.18);z-index:45;max-height:340px;overflow:auto;display:none}
.ci{padding:9px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #f3efe5;font-weight:400;color:var(--ink)}
.ci:last-child{border-bottom:0}.ci.on,.ci:hover{background:#fff6e0}.ci small{color:var(--muted);font-size:12.5px;white-space:nowrap}
details summary{cursor:pointer;color:var(--navy);font-size:16px}
details[open] summary{margin-bottom:10px}
code{background:#f3efe5;border-radius:6px;padding:2px 8px;font-family:inherit;display:inline-block;margin:2px 0}
#tabblock{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 30% 20%,#223a66,#0f1f3a 60%);display:flex;align-items:center;justify-content:center}
.card{box-shadow:0 1px 2px rgba(15,31,58,.04),0 6px 18px rgba(15,31,58,.04)}
button:disabled{opacity:.5;cursor:not-allowed}
.sync{font-size:12.5px;padding:3px 11px;border-radius:20px;background:#e8edf7;color:var(--navy);font-weight:700;white-space:nowrap}.sync.ok{background:var(--greenbg);color:var(--green)}.sync.busy{background:var(--amberbg);color:var(--amber)}.sync.off,.sync.auth{background:var(--redbg);color:var(--red)}
@media print{#tabblock,.topbar{display:none!important}}
html,body{margin:0}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:15px}
h2{margin:0;font-size:22px}h3{margin:0 0 12px;font-size:17px;color:var(--navy)}
.muted{color:var(--muted)}.red{color:var(--red)}.green{color:var(--green)}
small{color:var(--muted);font-weight:400}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#223a66,var(--navy) 60%)}
.login-box{background:#fff;border-radius:18px;padding:36px 34px;width:min(400px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.logo-en{font-family:'Cinzel',Georgia,serif;font-size:34px;letter-spacing:8px;color:var(--navy);font-weight:700}
.logo-sub{font-family:'Cinzel',Georgia,serif;letter-spacing:4px;font-size:11px;color:var(--gold);margin-top:2px}
.login-box label{text-align:right}
/* app */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--navy);color:#dfe6f3;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{text-align:center;padding:6px 0 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:10px}
aside .brand .logo-en{color:var(--gold2);font-size:24px;letter-spacing:6px}
aside .brand .logo-sub{color:#b8c3d9;font-size:9px}
aside a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;color:#dfe6f3;text-decoration:none;cursor:pointer;font-size:14.5px;margin-bottom:2px}
aside a:hover{background:var(--navy2)}
aside a.on{background:var(--gold);color:#fff;font-weight:700}
aside .me{margin-top:14px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px;font-size:13px;text-align:center}
main{padding:22px 26px 60px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.mt{margin-top:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:#374151;margin-bottom:8px}
input,select,textarea{border:1px solid #d6cfbf;border-radius:9px;padding:9px 11px;background:#fff;color:var(--ink);width:100%;font-weight:400}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold2);border-color:var(--gold)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>input,.row>select{flex:1;min-width:120px}
.row.end{justify-content:flex-end}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.danger{background:#fff;color:var(--red);border-color:#f0b6b0}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:4px solid var(--navy)}
.kpi.gold{border-top-color:var(--gold)}.kpi.red{border-top-color:var(--red)}.kpi.green{border-top-color:var(--green)}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}.kpi b{display:block;font-size:22px;margin-top:4px}
.kpi i{font-style:normal;font-size:12px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:#f3efe5;color:var(--navy);text-align:right;padding:9px 10px;font-weight:700;border-bottom:2px solid var(--line);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid #efeadf;vertical-align:middle}
table.t tr.sub td{background:#faf7f0;font-weight:700}
table.t tr.tot td{background:var(--navy);color:#fff;font-weight:700}
table.t tr.cancel td{color:#9ca3af;text-decoration:line-through}
.tw{overflow:auto}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700}
.b-red{background:var(--redbg);color:var(--red)}.b-green{background:var(--greenbg);color:var(--green)}.b-amber{background:var(--amberbg);color:var(--amber)}.b-navy{background:#e8edf7;color:var(--navy)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #d9d0bb;background:#fffdf8;border-radius:8px;padding:3px 9px;margin:2px;font-size:13.5px;cursor:pointer}
.chip:hover{border-color:var(--gold);background:#fff6e0}
.chip.static{cursor:default}
.chip .x{color:var(--red);font-weight:700;cursor:pointer}
.info{background:#f7f4ec;border:1px dashed #d6cbb0;border-radius:10px;padding:10px 12px;font-size:13.5px;align-self:end;margin-bottom:8px}
.sum{background:#f7f4ec;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;margin-bottom:8px}
.sum span{font-size:13px;color:var(--muted);font-weight:600}.sum b{font-size:18px}
.sum.big{background:var(--navy);color:#fff}.sum.big span{color:var(--gold2)}.sum.big b{font-size:22px}
.warn{background:var(--redbg);color:var(--red);border-radius:10px;padding:10px 12px;margin:8px 0;font-weight:600}
.note{background:var(--amberbg);color:#6b4b00;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.ok{background:var(--greenbg);color:var(--green);border-radius:10px;padding:10px 12px;margin:8px 0;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 16px;cursor:pointer;font-weight:700;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.thumb{width:46px;height:46px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;vertical-align:middle}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.icard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.icard .img{height:150px;background:#efe9dc center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#a79c84;cursor:zoom-in}
.icard .bd{padding:10px 12px;font-size:13.5px}
.icard .bd b{font-size:16px}
.sup-card{cursor:pointer;transition:.15s}.sup-card:hover{border-color:var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.06)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px;margin:10px 0}
.chk{flex-direction:row;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-weight:400;margin:0;cursor:pointer}
.chk input{width:auto}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding:10px 0;border-bottom:1px solid var(--line)}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.bars i{display:block;width:70%;background:var(--gold);border-radius:5px 5px 0 0;min-height:2px}
.bars i.neg{background:var(--red)}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(15,31,58,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
.mbox{background:#fff;border-radius:16px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.wide{width:min(980px,100%)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0}.mhead .x{border:0;background:none;font-size:26px;cursor:pointer;color:var(--muted)}
.mbody{padding:18px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:var(--navy);color:#fff;padding:10px 20px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-weight:600}
#toast div.err{background:var(--red)}
/* ===== printable document ===== */
.doc{background:#fff;color:#1a1a1a;font-size:13px;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact;overflow:hidden}
.doc .band{background:var(--navy);color:#fff;padding:18px 26px 14px;text-align:center;border-bottom:4px solid var(--gold)}
.doc .band .en{font-family:'Cinzel',Georgia,serif;font-size:34px;letter-spacing:10px;color:var(--gold2);font-weight:700;line-height:1.1}
.doc .band .sub{font-family:'Cinzel',Georgia,serif;font-size:11px;letter-spacing:5px;color:#d7deeb;margin-top:4px}
.doc .band .ar{font-size:14px;color:#fff;margin-top:6px;font-weight:600}
.doc .inner{padding:18px 26px 22px}
.doc .meta{display:flex;justify-content:space-between;gap:16px;margin-bottom:14px}
.doc .meta .ttl{font-size:20px;font-weight:800;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:3px;margin-bottom:6px;display:inline-block}
.doc .meta .box{border:1px solid #d9cfb8;border-radius:10px;padding:10px 14px;min-width:240px;background:#fcfaf5}
.doc .meta .box div{margin:2px 0}
.doc table{width:100%;border-collapse:collapse;margin-bottom:12px}
.doc th{background:var(--navy);color:var(--gold2);padding:8px 7px;font-size:12.5px;text-align:center;border:1px solid var(--navy)}
.doc td{border:1px solid #ddd3bd;padding:7px;text-align:center;font-size:12.5px}
.doc tr:nth-child(even) td{background:#fbf8f1}
.doc td.ms{text-align:right;font-size:12px;color:#444;line-height:1.7}
.doc .totals{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.doc .totals table{width:330px}
.doc .totals td{text-align:right;padding:6px 10px}
.doc .totals td:last-child{text-align:left;font-weight:700;direction:ltr}
.doc .totals tr.grand td{background:var(--navy);color:#fff;font-size:14px}
.doc .totals tr.grand td:last-child{color:var(--gold2)}
.doc .sign{display:flex;justify-content:space-around;margin-top:34px;font-size:13px}
.doc .sign div{border-top:1px solid #999;padding-top:6px;width:180px;text-align:center}
.doc .foot{margin-top:18px;border-top:1px solid var(--gold);padding-top:8px;text-align:center;font-size:11.5px;color:#666}
.doc .stamp{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);font-size:110px;font-weight:800;color:rgba(180,35,24,.18);border:10px solid rgba(180,35,24,.18);padding:0 30px;border-radius:20px;pointer-events:none}
.mbody .doc{border:1px solid var(--line);border-radius:10px}
#print-area{display:none}
@media print{
  body{background:#fff}
  #app,#login,#modal,#toast{display:none!important}
  #print-area{display:block}
  @page{size:A4;margin:9mm}
  .doc{border:0!important}
}
#navtog{display:none}
@media(max-width:900px){#app{grid-template-columns:1fr}aside{position:sticky;top:0;z-index:40;height:auto;max-height:100vh;padding:8px 12px}aside .brand{display:flex;align-items:center;justify-content:space-between;padding:4px 0;margin:0;border:0;text-align:right}aside .brand .logo-en{font-size:20px;letter-spacing:4px}aside .brand .logo-sub{display:none}#navtog{display:inline-block;background:var(--gold);color:#fff;border:0;border-radius:9px;padding:8px 14px;font-weight:700;font-size:15px;cursor:pointer}aside:not(.open) a,aside:not(.open) .me{display:none}aside.open{overflow:auto}.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}main{padding:14px}}
</style>
</head>
<body>
<div id="login" hidden></div>
<div id="app" hidden><aside id="nav"></aside><main><div class="topbar" id="topbar"></div><div id="view"></div></main></div><div id="tabblock" hidden></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="print-area"></div>

<script>
/* ================= أدوات ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const fmt=n=>r2(n).toLocaleString('en-US',{maximumFractionDigits:2});
const toEn=s=>String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.');
function num(v){const n=parseFloat(toEn(v).replace(/,/g,'').trim());return isNaN(n)?0:n}
function parseMeters(s){return toEn(s).split(/[\s,،+\/\*]+/).map(x=>parseFloat(x)).filter(x=>!isNaN(x)&&x>0)}
function todayLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function addDays(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+(+n||0));return d.toISOString().slice(0,10)}
const fd=d=>d&&d!=='0000-00-00'?d.split('-').reverse().join('/'):'—';
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const METHODS={cash:'نقدي',instapay:'إنستاباي',vodafone:'محفظة كاش'};
const DAYS=['السبت','الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة'];const DAYS_JS=['الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة','السبت'];
function dayOf(t){const n=normAr(String(t||'').replace(/^يوم\s*/,''));const al={'السبت':'السبت','سبت':'السبت','الاحد':'الأحد','احد':'الأحد','الاتنين':'الاتنين','الاثنين':'الاتنين','اتنين':'الاتنين','اثنين':'الاتنين','التلات':'التلات','الثلاثاء':'التلات','الثلاث':'التلات','تلات':'التلات','ثلاثاء':'التلات','الاربع':'الأربع','الاربعاء':'الأربع','اربع':'الأربع','اربعاء':'الأربع','الخميس':'الخميس','خميس':'الخميس','الجمعه':'الجمعة','جمعه':'الجمعة'};return al[n]||''}
const EXP_CATS={rent:'إيجار',labor:'عمالة',transport:'نقل',other:'مصروفات أخرى'};
const methodOpts=sel=>Object.entries(METHODS).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v}</option>`).join('');
const opt=(v,l,sel)=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l)}</option>`;
function toast(msg,type){const d=document.createElement('div');d.textContent=msg;if(type)d.className=type;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3200)}
function modal(title,body,wide){$('#modal').innerHTML=`<div class="mbg" onmousedown="if(event.target===this)closeModal()"><div class="mbox ${wide?'wide':''}"><div class="mhead"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div><div class="mbody">${body}</div></div></div>`}
function closeModal(){$('#modal').innerHTML=''}
function view(html){$('#view').innerHTML=html}

/* ================= التخزين ================= */
const EMPTY=()=>({version:1,
 settings:{brandEn:'AL TAREQ',brandSub:'FABRICS TRADING COMPANY',companyAr:'شركة الطارق لتجارة الأقمشة',phone:'',address:'',invoiceNote:'البضاعة المباعة لا ترد ولا تستبدل إلا بموافقة الإدارة',openingSafe:{cash:0,instapay:0,vodafone:0},lastBackup:'',lockMin:15,autoBackup:true},
 users:[{id:'u_admin',name:'المدير',username:'admin',pass:'1234',role:'admin'},{id:'u_acc',name:'المحاسب',username:'user',pass:'1111',role:'acc'}],
 suppliers:[],items:[],rolls:[],customers:[],purchases:[],sales:[],receipts:[],supPayments:[],expenses:[],withdrawals:[],transfers:[],supDues:[],dayImports:[],wallets:{},collect:null,custReturns:[],supReturns:[],log:[],
 counters:{purchase:0,sale:0,receipt:0,supPay:0,custRet:0,supRet:0}});
const Store={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('altareq_fabrics',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})},
 async load(){this.db=await this.open();if(this.db){const v=await new Promise(res=>{try{const q=this.db.transaction('kv').objectStore('kv').get('data');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}});if(v)return v}
  try{const s=localStorage.getItem('altareq_fabrics');if(s)return JSON.parse(s)}catch(e){}return null},
 async save(data){if(this.db){const ok=await new Promise(res=>{try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(data,'data');tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}});if(ok)return true}
  try{localStorage.setItem('altareq_fabrics',JSON.stringify(data));return true}catch(e){return false}}
};
let D=null,ME=null,CUR='dashboard';

function saleCost(s){return (s.rolls||[]).reduce((a,r)=>a+r.meters*r.cost,0)+(s.mlines||[]).reduce((a,l)=>a+num(l.cost),0)}

/* الربح المحصّل: كل فلوس بتدخل من العميل بتتوزع على أقدم فاتورة، وكل جنيه بيتحصل بيطلع معاه نسبة ربح الفاتورة دي */
function simulateCustomer(cid){
 const c=cust(cid),ev=[],op=num(c.opening);let credit=op<0?-op:0;
 if(op>0)ev.push({t:'debt',date:'0000-00-00',seq:0,amount:op,ratio:num(c.openingPct)/100,ref:'opening'});
 live(D.sales).filter(s=>s.customerId===cid).forEach(s=>{const net=saleNet(s),nc=saleNetCost(s);ev.push({t:'sale',date:s.date,seq:s.createdAt||0,amount:net,ratio:net>0?(net-nc)/net:0,paid:s.paid||0,ref:s.id,due:s.due||''})});
 live(D.receipts).filter(r=>r.customerId===cid).forEach(r=>ev.push({t:'pay',date:r.date,seq:r.createdAt||0,amount:r.amount}));
 ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.seq-b.seq));
 const open=[],realized=[];
 const applyTo=(d,amt,date)=>{const x=Math.min(d.rem,amt);if(x>0){d.rem-=x;realized.push({date,amount:x,profit:x*d.ratio,cid,from:d.date})}return amt-Math.max(x,0)};
 const fifo=(amt,date)=>{for(const d of open){if(amt<=1e-9)break;if(d.rem>1e-9)amt=applyTo(d,amt,date)}return amt};
 for(const e of ev){
  if(e.t==='debt')open.push({rem:e.amount,ratio:e.ratio,ref:e.ref,date:e.date,due:''});
  else if(e.t==='sale'){const d={rem:Math.max(e.amount,0),ratio:e.ratio,ref:e.ref,date:e.date,due:e.due};open.push(d);let left=e.paid+(e.amount<0?-e.amount:0);left=applyTo(d,left,e.date);credit+=left;if(credit>1e-9)credit=fifo(credit,e.date)}
  else{credit+=fifo(e.amount,e.date)}
 }
 return {open,realized,credit};
}
function allRealized(){const out=[];D.customers.forEach(c=>out.push(...simulateCustomer(c.id).realized));return out}
function periodStats(prefix,realized){
 const inP=d=>d&&d.startsWith(prefix);
 const realizedProfit=realized.filter(x=>inP(x.date)).reduce((a,x)=>a+x.profit,0);
 const collected=live(D.sales).filter(s=>inP(s.date)).reduce((a,s)=>a+(s.paid||0),0)+live(D.receipts).filter(r=>inP(r.date)).reduce((a,r)=>a+r.amount,0);
 const ss=live(D.sales).filter(s=>inP(s.date));
 const salesNet=ss.reduce((a,s)=>a+saleNet(s),0),salesProfit=ss.reduce((a,s)=>a+saleNet(s)-saleNetCost(s),0);
 const exp={};Object.keys(EXP_CATS).forEach(k=>exp[k]=0);live(D.expenses).filter(x=>inP(x.date)).forEach(x=>exp[x.cat]=(exp[x.cat]||0)+x.amount);
 const expTotal=Object.values(exp).reduce((a,b)=>a+b,0);
 const wd=live(D.withdrawals).filter(x=>inP(x.date)).reduce((a,x)=>a+x.amount,0);
 const purchases=live(D.purchases).filter(p=>inP(p.date)).reduce((a,p)=>a+p.goods+p.shipping,0);
 return {collected,realizedProfit,salesNet,salesProfit,exp,expTotal,wd,purchases,opProfit:realizedProfit-expTotal,net:realizedProfit-expTotal-wd};
}
function safeMoves(){const m=[];
 live(D.sales).forEach(s=>{if(s.paid>0)m.push({date:s.date,method:s.method,amount:s.paid,desc:`دفعة فاتورة بيع #${s.no} — ${cust(s.customerId).name}`})});
 live(D.receipts).forEach(r=>m.push({date:r.date,method:r.method,amount:r.amount,desc:`تحصيل #${r.no} من ${cust(r.customerId).name}${r.wallet?' — على '+r.wallet:''}`}));
 live(D.purchases).forEach(p=>{if(p.paid>0)m.push({date:p.date,method:p.method,amount:-p.paid,desc:`دفعة فاتورة شراء #${p.no} — ${sup(p.supplierId).name}`});if(p.shipping>0&&!p.shipOnSupplier)m.push({date:p.date,method:p.shipMethod,amount:-p.shipping,desc:`شحن فاتورة شراء #${p.no}`})});

 live(D.expenses).forEach(x=>m.push({date:x.date,method:x.method,amount:-x.amount,desc:`مصروف ${EXP_CATS[x.cat]||''}${x.note?' — '+x.note:''}`}));

 return m.sort((a,b)=>a.date<b.date?1:-1)}

 e.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.seq-b.seq);let bal=0;e.forEach(x=>{bal+=x.debit-x.credit;x.bal=bal});return e}

/* ================= استيراد فاتورة المستورد PDF ================= */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadPdfJs(){return new Promise((res,rej)=>{if(window.pdfjsLib)return res(window.pdfjsLib);const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';res(pdfjsLib)};s.onerror=()=>rej(new Error('net'));document.head.appendChild(s)})}
const normAr=s=>String(s||'').normalize('NFKC').replace(/[ـ‎‏‪-‮⁦-⁩ً-ْ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
const revStr=s=>[...s].reverse().join('');
const hasW=(s,w)=>{const n=normAr(s);return n.includes(w)||revStr(n).includes(w)};
const isNumTxt=s=>/^-?[\d,]+(\.\d+)?$/.test(toEn(normAr(s)));
const nearest=(arr,x,k='cx')=>arr.reduce((a,b)=>Math.abs(b[k]-x)<Math.abs(a[k]-x)?b:a);
async function parseSupplierPdf(file){const lib=await loadPdfJs();const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;const pages=[];let text='';
 for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();const its=[];tc.items.forEach(it=>{const s=(it.str||'').trim();if(!s)return;its.push({s,x:it.transform[4]+(it.width||0)/2,y:it.transform[5]});text+=' '+s});pages.push(its)}
 let blocks=[];pages.forEach(its=>{const bs=extractPage(its);if(!bs)return;bs.forEach((b,i)=>{if(!b.name&&blocks[i])b.name=blocks[i].name;if(!b.price&&blocks[i])b.price=blocks[i].price;const ex=blocks.find(x=>x.name&&x.name===b.name);if(ex)ex.rows.push(...b.rows);else blocks.push(b)})});
 blocks=blocks.filter(b=>b.rows.length);
 const t=toEn(normAr(text));let date='';const dm=t.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/),dy=t.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
 if(dm)date=`${dm[3]}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;else if(dy)date=`${dy[1]}-${dy[2].padStart(2,'0')}-${dy[3].padStart(2,'0')}`;
 let total=0;pages.forEach(its=>{const lb=its.find(i=>hasW(i.s,'الفاتوره')&&hasW(i.s,'اجمال'));if(lb){const ns=its.filter(i=>isNumTxt(i.s)&&Math.abs(i.y-lb.y)<4);if(ns.length&&!total)total=num(nearest(ns.map(n=>({...n,cx:n.x})),lb.x).s)}});
 const nt=normAr(text),rt=revStr(nt);const sp=D.suppliers.find(s=>{const n=normAr(s.name);return n&&(nt.includes(n)||rt.includes(n))});
 return {blocks,date,total,supplierId:sp?sp.id:(PUR.supplierId||'')}}
function extractPage(its){
 const L=its.filter(i=>hasW(i.s,'لون')&&normAr(i.s).length<=4),M=its.filter(i=>hasW(i.s,'متر')&&normAr(i.s).length<=4);if(!L.length||!M.length)return null;
 const hy=Math.max(...L.map(i=>i.y));
 const blocks=L.filter(l=>Math.abs(l.y-hy)<6).map(l=>{const m=M.reduce((a,b)=>Math.abs(b.x-l.x)<Math.abs(a.x-l.x)?b:a);return {lx:l.x,mx:m.x,cx:(l.x+m.x)/2,cols:[],mets:[],rows:[],name:'',price:0}}).sort((a,b)=>b.cx-a.cx);
 const half=blocks.length>1?Math.abs(blocks[0].cx-blocks[1].cx)/2:250;
 const mlab=its.find(i=>normAr(i.s)==='م'&&Math.abs(i.y-hy)<40);
 its.filter(i=>i.y<hy-3&&isNumTxt(i.s)).forEach(i=>{const b=nearest(blocks,i.x);if(Math.abs(b.cx-i.x)>half)return;if(mlab&&Math.abs(i.x-mlab.x)<Math.abs(i.x-b.cx))return;(Math.abs(i.x-b.lx)<Math.abs(i.x-b.mx)?b.cols:b.mets).push(i)});
 blocks.forEach(b=>{b.mets.forEach(m=>{let c=null,d=99;b.cols.forEach(k=>{const dd=Math.abs(k.y-m.y);if(dd<d){d=dd;c=k}});const v=num(m.s);if(v>0)b.rows.push({color:c&&d<5?toEn(normAr(c.s)):'',meters:v})})});
 const flip=!normAr(L[0].s).includes('لون');
 its.filter(i=>i.y>hy+2&&i.y<hy+35&&!isNumTxt(i.s)&&!hasW(i.s,'لون')&&!hasW(i.s,'متر')&&normAr(i.s)!=='م').forEach(i=>{const b=nearest(blocks,i.x);const nm=flip?revStr(normAr(i.s)):normAr(i.s);if(Math.abs(b.cx-i.x)<=half)b.name=b.name?(flip?nm+' '+b.name:b.name+' '+nm):nm});
 const pl=its.find(i=>hasW(i.s,'سعر'));if(pl)its.filter(i=>isNumTxt(i.s)&&Math.abs(i.y-pl.y)<4).forEach(i=>{const b=nearest(blocks,i.x);if(Math.abs(b.cx-i.x)<=half)b.price=num(i.s)});
 return blocks}
let IMP=null;
function importPdfModal(){IMP=null;modal('استيراد فاتورة المستورد',`<p>اختار ملف الـPDF اللي المستورد بعتهولك. البرنامج هيقرا الأصناف والألوان والأمتار والأسعار، وتراجعهم قبل ما يتنقلوا للفاتورة.</p><input type="file" accept="application/pdf,.pdf" onchange="importPdfRun(this)"><div id="imp_out" class="mt"></div>`,true)}
async function importPdfRun(inp){const f=inp.files[0];if(!f)return;$('#imp_out').innerHTML='<p class="muted">بقرا الفاتورة...</p>';
 try{IMP=await parseSupplierPdf(f)}catch(e){$('#imp_out').innerHTML=`<div class="warn">${e.message==='net'?'قراءة الـPDF محتاجة نت (أول مرة بس في كل فتحة للبرنامج). اتأكد إن النت شغال وجرّب تاني.':'مقدرتش أقرا الملف ده. اتأكد إنه PDF فيه كتابة مش صورة متصورة.'}</div>`;return}
 if(!IMP.blocks.length){$('#imp_out').innerHTML='<div class="warn">مقدرتش ألاقي جدول أصناف في الفاتورة دي.</div>';return}
 IMP.blocks.forEach(b=>b.map='');IMP.date=IMP.date||todayLocal();impAutoMap();renderImp()}
function impMatch(supId,name){const n=normAr(name),r=revStr(n);return D.items.find(i=>i.supplierId===supId&&(normAr(i.name)===n||normAr(i.name)===r))}
function impAutoMap(){IMP.blocks.forEach(b=>{const it=IMP.supplierId&&impMatch(IMP.supplierId,b.name);b.map=it?it.id:'__new'})}
function renderImp(){const its=D.items.filter(i=>i.supplierId===IMP.supplierId);let calc=0,rolls=0,meters=0;
 const rowsH=IMP.blocks.map((b,k)=>{const m=b.rows.reduce((a,r)=>a+r.meters,0);calc+=m*b.price;rolls+=b.rows.length;meters+=m;const cols={};b.rows.forEach(r=>(cols[r.color]=cols[r.color]||[]).push(r.meters));
  return `<tr><td><b>${esc(b.name||'بدون اسم')}</b></td><td><select onchange="IMP.blocks[${k}].map=this.value;renderImp()">${its.map(i=>opt(i.id,i.name,b.map)).join('')}<option value="__new" ${b.map==='__new'?'selected':''}>+ صنف جديد: ${esc(b.name||'')}</option></select></td><td><input style="width:85px" value="${b.price||''}" onchange="IMP.blocks[${k}].price=num(this.value);renderImp()"></td><td>${b.rows.length}</td><td>${fmt(m)}</td><td class="ms">${Object.keys(cols).sort(natSort).map(c=>`<span class="badge b-navy">لون ${esc(c||'؟')}</span> ${cols[c].map(fmt).join(' • ')}`).join('<br>')}</td><td><b>${fmt(m*b.price)}</b></td></tr>`}).join('');
 const ok=IMP.total?Math.abs(IMP.total-calc)<1:null;
 $('#imp_out').innerHTML=`<div class="grid g3"><label>المستورد<select onchange="IMP.supplierId=this.value;impAutoMap();renderImp()"><option value="">اختار المستورد</option>${D.suppliers.map(s=>opt(s.id,s.name,IMP.supplierId)).join('')}</select></label><label>تاريخ الفاتورة<input type="date" value="${IMP.date}" onchange="IMP.date=this.value"></label><div class="info">${rolls} توب • ${fmt(meters)} متر</div></div>
 ${IMP.supplierId?'':'<div class="note">اسم المستورد مش مكتوب في الفاتورة، اختاره من فوق.</div>'}
 <div class="tw"><table class="t"><tr><th>الصنف في الفاتورة</th><th>يتسجل على صنف</th><th>سعر المتر</th><th>توبات</th><th>أمتار</th><th>الألوان والأمتار</th><th>القيمة</th></tr>${rowsH}<tr class="tot"><td colspan="3">الإجمالي</td><td>${rolls}</td><td>${fmt(meters)}</td><td></td><td>${fmt(calc)}</td></tr></table></div>
 ${ok===true?`<div class="ok">✔ الإجمالي مطابق لإجمالي فاتورة المستورد (${fmt(IMP.total)})</div>`:ok===false?`<div class="warn">⚠ الإجمالي المحسوب ${fmt(calc)} مختلف عن إجمالي الفاتورة ${fmt(IMP.total)} — راجع الأسعار</div>`:''}
 ${IMP.blocks.some(b=>b.rows.some(r=>!r.color))?'<div class="warn">فيه توبات من غير كود لون (ظاهرة بـ؟) — صلّحها بعد النقل.</div>':''}
 <div class="row end"><button class="btn gold" onclick="importApply()">نقل للفاتورة</button></div>`}
async function importApply(){if(!IMP.supplierId)return toast('اختار المستورد','err');if(IMP.blocks.some(b=>!(b.price>0)))return toast('فيه صنف من غير سعر متر','err');
 if(PUR.lines.length&&!confirm('الفاتورة الحالية فيها بنود، هتتمسح وتتبدل بالفاتورة المستوردة. تكمل؟'))return;
 newPur();PUR.supplierId=IMP.supplierId;PUR.date=IMP.date;let added=[];
 for(const b of IMP.blocks){let id=b.map;if(id==='__new'||!byId(D.items,id)){const ex=impMatch(IMP.supplierId,b.name);if(ex)id=ex.id;else{const it={id:uid(),createdAt:Date.now(),supplierId:IMP.supplierId,name:b.name||'صنف جديد',sell:0,buy:b.price,colors:[],image:null};D.items.push(it);id=it.id;added.push(it.name)}}
  const by={};b.rows.forEach(r=>(by[r.color||'؟']=by[r.color||'؟']||[]).push(r.meters));Object.keys(by).sort(natSort).forEach(c=>PUR.lines.push({itemId:id,color:c,price:b.price,meters:by[c]}))}
 if(added.length)await commit('إضافة صنف',`${added.join('، ')} — ${sup(IMP.supplierId).name} (من استيراد فاتورة)`);

  h+=`<tr class="sub" style="background:#efe6cf"><td colspan="3">إجمالي ${esc(sup(sid).name)}</td><td>${sR}</td><td>${fmt(sM)}</td>${showCost?`<td>${fmt(sV)}</td>`:''}${STK.show?'<td></td>':''}</tr>`;gR+=sR;gM+=sM;gV+=sV});

/* ================= الأمان ================= */
function sha256(str){const s=unescape(encodeURIComponent(String(str)));const rr=(v,n)=>(v>>>n)|(v<<(32-n));const maxW=Math.pow(2,32);const K=[],H=[];const comp={};let pc=0;
 for(let c=2;pc<64;c++){if(!comp[c]){for(let i=0;i<313;i+=c)comp[i]=c;if(pc<8)H[pc]=(Math.pow(c,.5)*maxW)|0;K[pc++]=(Math.pow(c,1/3)*maxW)|0}}
 let a=s+'\x80';const w=[];while(a.length%64-56)a+='\x00';for(let i=0;i<a.length;i++){const j=a.charCodeAt(i);w[i>>2]|=j<<((3-i)%4)*8}
 const bl=s.length*8;w[w.length]=(bl/maxW)|0;w[w.length]=bl;let h=H.slice(0,8);
 for(let j=0;j<w.length;){const W=w.slice(j,j+=16),old=h;h=h.slice(0,8);
  for(let i=0;i<64;i++){const w15=W[i-15],w2=W[i-2],A=h[0],E=h[4];
   const t1=h[7]+(rr(E,6)^rr(E,11)^rr(E,25))+((E&h[5])^((~E)&h[6]))+K[i]+(W[i]=(i<16)?W[i]:(W[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+W[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   const t2=(rr(A,2)^rr(A,13)^rr(A,22))+((A&h[1])^(A&h[2])^(h[1]&h[2]));h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0}
  for(let i=0;i<8;i++)h[i]=(h[i]+old[i])|0}
 let out='';for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(h[i]>>(j*8))&255;out+=(b<16?'0':'')+b.toString(16)}return out}
const checkPass=(u,p)=>!!u.hash&&u.hash===sha256((u.salt||'')+p);

function parseQuick(text){const out=[],bad=[];String(text||'').split(/\r?\n/).forEach(raw=>{const line=toEn(raw).trim();if(!line)return;const i=line.search(/[:=]/);if(i<0){bad.push(raw.trim());return}
 let left=line.slice(0,i).trim(),right=line.slice(i+1),price=0;const pm=right.match(/@\s*([\d.,]+)/);if(pm){price=num(pm[1]);right=right.replace(pm[0],' ')}
 const meters=parseMeters(right);const tk=left.split(/\s+/).filter(Boolean);let color='';if(tk.length>1&&/\d/.test(tk[tk.length-1])){color=tk.pop();if(tk.length>1&&normAr(tk[tk.length-1])==='لون')tk.pop()}
 const name=tk.join(' ');if(!name||!meters.length){bad.push(raw.trim());return}out.push({raw:raw.trim(),name,color,meters,price})});return {out,bad}}

  const used=new Set(SALE.rolls.map(x=>x.rollId));let best=null;
  cands.forEach(it=>{const pool=stock().filter(r=>r.itemId===it.id&&!used.has(r.id)&&(!l.color||r.color===l.color));const got=[],nf=[];l.meters.forEach(m=>{const k=pool.findIndex(r=>Math.abs(r.meters-m)<0.001);if(k<0)nf.push(m);else got.push(pool.splice(k,1)[0])});if(!best||got.length>best.got.length)best={it,got,nf}});

 bad.forEach(b=>{msgs.push(`✘ السطر ده مش مفهوم (ناقص علامة : بين الصنف والأمتار): ${b}`);left.push(b)});
 $('#s_qtxt').value=left.join('\n');$('#s_qmsg').innerHTML=(added?`<div class="ok">✔ اتضاف ${added} توب للفاتورة</div>`:'')+(msgs.length?`<div class="warn">${msgs.map(esc).join('<br>')}</div>`:'');saleRenderLines();if(itemByLabel($('#s_item').value))saleShowAvail()}

function purDates(){const m={};D.purchases.forEach(p=>m[p.id]=p.date);return m}
function soldRows(from){const out=[],pd=purDates();
 live(D.sales).filter(s=>s.date>=from).forEach(s=>{const ret=new Set();saleReturns(s.id).forEach(r=>r.rolls.forEach(x=>ret.add(x.rollId)));const goods=saleGoods(s),f=goods>0?1-(s.discount||0)/goods:1;

function custRating(c){const td=todayLocal(),sim=simulateCustomer(c.id),b=custBalance(c.id);let od=0,odDays=0;
 sim.open.forEach(d=>{if(d.rem>0.5&&d.due&&d.due<td){od+=d.rem;odDays=Math.max(odDays,daysBetween(d.due,td))}});
 let w=0,ws=0;sim.realized.forEach(x=>{if(x.from&&x.from!=='0000-00-00'&&x.date!==x.from){w+=x.amount;ws+=x.amount*Math.max(0,daysBetween(x.from,x.date))}});const avg=w>0?ws/w:null;
 const yr=addDays(td,-365),sales=live(D.sales).filter(s=>s.customerId===c.id&&s.date>=yr).reduce((a,s)=>a+saleNet(s),0);const terms=num(c.terms)||30;
 let rate,cls,advice='';if(od>0.5&&odDays>60){rate='خطر';cls='b-red';advice='وقّف الآجل لحد ما يسدد المتأخر'}else if(od>0.5){rate='متأخر';cls='b-amber';advice='كلّمه في المتأخر قبل ما تبيعله آجل تاني'}else if(avg!==null&&avg>terms*1.2){rate='بطيء';cls='b-amber';advice='بيسدد بعد الميعاد — قلّل حد الآجل'}else if(avg!==null){rate=avg<=terms*0.7?'ممتاز':'كويس';cls='b-green'}else{rate=b>0.5?'جديد':'—';cls='b-navy'}

 else if(AN.tab==='low'){const rows=soldRows(addDays(todayLocal(),-90)),sold={},st={};rows.forEach(r=>{const k=r.itemId+'|'+r.color;sold[k]=(sold[k]||0)+1});stock().forEach(r=>{const k=r.itemId+'|'+r.color;st[k]=(st[k]||0)+1});

 else{const R=D.customers.map(custRating).filter(x=>x.sales>0||x.b>0.5).sort((a,b)=>({خطر:0,متأخر:1,بطيء:2,جديد:3,كويس:4,ممتاز:5,'—':6}[a.rate]-{خطر:0,متأخر:1,بطيء:2,جديد:3,كويس:4,ممتاز:5,'—':6}[b.rate])||b.od-a.od);
  body=`<div class="note">التقييم من سرعة سداد العميل الفعلية (متوسط الأيام من الفاتورة لحد ما فلوسها اتحصلت) ومن الفواتير اللي فات ميعادها. مدة السداد المتفق عليها من بيانات العميل.</div><div class="card"><div class="tw"><table class="t"><tr><th>العميل</th><th>التقييم</th><th>مشترياته (سنة)</th><th>الرصيد</th><th>متأخر</th><th>بيسدد بعد</th><th>المتفق</th><th>نصيحة</th></tr>${R.map(x=>`<tr><td><b>${esc(x.c.name)}</b></td><td><span class="badge ${x.cls}">${x.rate}</span></td><td>${fmt(x.sales)}</td><td>${fmt(x.b)}</td><td class="${x.od>0.5?'red':''}">${x.od>0.5?fmt(x.od)+` <small>(${x.odDays} يوم)</small>`:'—'}</td><td>${x.avg!==null?Math.round(x.avg)+' يوم':'—'}</td><td>${num(x.c.terms)||30} يوم</td><td>${esc(x.advice)}</td></tr>`).join('')}</table></div></div>`}

 view(`<div class="page-head"><h2>التحصيل اليومي — ${isToday?'النهارده '+dn+' '+fd(td):'عملاء يوم '+dn}</h2><label style="margin:0">عملاء يوم<select onchange="COLDAY=this.value;COLF='today';go('collect')">${DAYS.map(d=>`<option value="${d}" ${d===dn?'selected':''}>${d}${d===DAYS_JS[new Date().getDay()]?' (النهارده)':''} — ${D.customers.filter(c=>c.day===d).length} عميل</option>`).join('')}</select></label></div>

 <div class="card">${L.length?`<div class="tw"><table class="t"><tr><th>العميل</th><th>التليفون</th><th>الرصيد</th><th>متأخر</th><th>آخر دفعة</th><th></th></tr>${L.map(x=>`<tr id="col_${x.c.id}"><td><b>${esc(x.c.name)}</b> ${x.c.day?`<span class="badge b-navy">${x.c.day}</span>`:''}</td><td>${esc(x.c.phone||'—')}</td><td><b>${fmt(x.b)}</b></td><td class="${x.od>0.5?'red':''}">${x.od>0.5?fmt(x.od)+` <small>(${x.odDays} يوم)</small>`:'—'}</td><td>${x.last?fd(x.last)+` <small>(${daysBetween(x.last,td)} يوم)</small>`:'—'}</td>

 <div class="card"><details><summary><b>✎ نص رسالة التحصيل</b></summary><p class="muted">تقدر تستخدم: {الاسم} {الرصيد} {المتأخر} {الشركة}</p><textarea id="col_tpl" rows="6">${esc(D.settings.colTpl||COL_TPL_DEF)}</textarea><div class="row mt"><button class="btn" onclick="colTplSave()">حفظ النص</button><button class="btn ghost" onclick="$('#col_tpl').value=COL_TPL_DEF">رجّع النص الأصلي</button></div></details></div>

VIEWS.forecast=function(){const td=todayLocal(),from=addDays(td,-56),cash=Object.keys(METHODS).reduce((a,k)=>a+safeBalance(k),0);
 const inR=(d)=>d>=from&&d<=td;const colPace=live(D.receipts).filter(r=>inR(r.date)).reduce((a,r)=>a+r.amount,0)/8;
 const supPace=(live(D.supPayments).filter(x=>inR(x.date)).reduce((a,x)=>a+x.amount,0)+live(D.purchases).filter(p=>inR(p.date)).reduce((a,p)=>a+p.paid+(p.shipOnSupplier?0:p.shipping),0))/8;
 const expPace=live(D.expenses).filter(x=>inR(x.date)).reduce((a,x)=>a+x.amount,0)/8,wdPace=live(D.withdrawals).filter(x=>inR(x.date)).reduce((a,x)=>a+x.amount,0)/8;
 let recv=0;const dues=[];D.customers.forEach(c=>{simulateCustomer(c.id).open.forEach(d=>{if(d.rem>0.5){recv+=d.rem;dues.push({c,rem:d.rem,due:d.due||'',ref:d.ref})}})});
 let supOwe=0;D.suppliers.forEach(s=>{const b=supBalance(s.id);if(b>0)supOwe+=b});
 const plans=(D.supDues||[]).filter(x=>!x.done&&!x.cancelled);let left=recv,bal=cash;const W=[];
 for(let i=0;i<4;i++){const s=addDays(td,7*i),e=addDays(td,7*i+6);const dueW=dues.filter(d=>i===0?(d.due&&d.due<=e):(d.due>=s&&d.due<=e)).reduce((a,d)=>a+d.rem,0);
  const inc=Math.min(left,colPace);left-=inc;const pl=plans.filter(p=>i===0?p.date<=e:(p.date>=s&&p.date<=e));const plSum=pl.reduce((a,p)=>a+p.amount,0);const supOut=pl.length?plSum:supPace;
  const out=supOut+expPace+wdPace;bal+=inc-out;W.push({i,s,e,dueW,inc,supOut,planned:pl.length>0,exp:expPace+wdPace,out,bal})}
 const minBal=Math.min(cash,...W.map(w=>w.bal)),safety=expPace*2,canBuy=Math.max(0,minBal-safety),maxAbs=Math.max(1,...W.map(w=>Math.abs(w.bal)));
 const soon=dues.filter(d=>d.due&&d.due<=addDays(td,13)).sort((a,b)=>a.due<b.due?-1:1).slice(0,25);
 view(`<div class="page-head"><h2>توقع الفلوس — الـ4 أسابيع الجاية</h2></div>
 <div class="kpis"><div class="kpi gold"><span>معاك دلوقتي (كل الخزن)</span><b>${fmt(cash)} ج</b></div><div class="kpi"><span>فلوسك عند العملاء</span><b>${fmt(recv)} ج</b><i>بتحصّل في المتوسط ${fmt(colPace)} ج في الأسبوع</i></div><div class="kpi red"><span>عليك للمستوردين</span><b>${fmt(supOwe)} ج</b><i>بتدفع في المتوسط ${fmt(supPace)} ج في الأسبوع</i></div><div class="kpi green"><span>تقدر تشتري بضاعة كاش بحوالي</span><b>${fmt(canBuy)} ج</b><i>ومن غير ما الخزنة تقل عن مصاريف أسبوعين</i></div></div>
 <div class="card"><h3>رصيد الخزنة المتوقع آخر كل أسبوع</h3><div class="bars">${W.map(w=>`<div title="${fmt(w.bal)}"><small>${fmt(w.bal/1000)}k</small><i class="${w.bal<0?'neg':''}" style="height:${barH(w.bal,W)}%"></i>${fd(w.e).slice(0,5)}</div>`).join('')}</div>

  pages.push({w:s.width,h,jpg:new Uint8Array(await (await canvasBlob(s,'image/jpeg',0.9)).arrayBuffer())})}
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;const put=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};const obj=(n,body)=>{offs[n]=len;put(n+' 0 obj\n');body();put('\nendobj\n')};

  obj(pn,()=>put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${cn} 0 R >>`));
  obj(cn,()=>put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  obj(im,()=>{put(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`);put(p.jpg);put('\nendstream')})});

const _renderTopbarP=renderTopbar;renderTopbar=function(){_renderTopbarP();const r=$('#topbar .tb-r');if(r&&/^https?:$/.test(location.protocol)&&!window.matchMedia('(display-mode: standalone)').matches)r.insertAdjacentHTML('afterbegin',`<button id="installBtn" class="btn sm gold" ${INSTALL_EVT?'':'hidden'} onclick="installApp()">⬇ ثبّت البرنامج على الجهاز</button>`)};


/* ================= تشغيل ================= */
(async function boot(){Cloud.load();if(!tabCheck())return;D=await Store.load();if(!D){D=EMPTY()}migrate();await Store.save(D);Store.snapToday(D);try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 tabStart();activityStart();if(Cloud.on){await Cloud.loadMeta();setInterval(()=>Cloud.poll(),12000);window.addEventListener('online',()=>Cloud.poll())}
 const sid=sessionStorage.getItem('altareq_user');if(sid&&byId(D.users,sid)){ME=byId(D.users,sid);DRAFT_USER=ME.id;startApp();if(Cloud.on)setTimeout(()=>Cloud.poll(),300)}else showLogin()})();
</script>
